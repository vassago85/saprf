services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saprf_app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: saprf_nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: saprf_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saprf_platform
      MYSQL_USER: saprf
      MYSQL_PASSWORD: saprf_password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - saprf_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saprf_redis
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saprf_queue
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saprf_scheduler
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "schedule:work"]
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - app

volumes:
  saprf_mysql_data:
