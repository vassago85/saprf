services:
  app:
    # Single image built once, reused by `queue` and `scheduler` below via
    # `image: saprf-app:latest`. This keeps all three PHP containers in
    # lock-step: `docker compose build --no-cache app` rebuilds one image,
    # and `up -d --force-recreate app queue scheduler` picks it up
    # everywhere. Do NOT add separate `build:` blocks to queue/scheduler
    # unless you also want three separate image builds and the class-desync
    # bug that comes with them (queue container running stale code that the
    # app container has since moved past).
    image: saprf-app:latest
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: saprf-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=saprf-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saprf_platform}
      - DB_USERNAME=${DB_USERNAME:-saprf}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
    ports:
      - "8090:80"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - saprf-storage:/var/www/html/storage/app
      - saprf-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - saprf-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mariadb:10.11
    container_name: saprf-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-ssl
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Root password required}
      MYSQL_DATABASE: ${DB_DATABASE:-saprf_platform}
      MYSQL_USER: ${DB_USERNAME:-saprf}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Database password required}
    volumes:
      - saprf-db:/var/lib/mysql
    networks:
      - saprf-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: saprf-redis
    restart: unless-stopped
    networks:
      - saprf-internal

  queue:
    image: saprf-app:latest
    container_name: saprf-queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=saprf-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saprf_platform}
      - DB_USERNAME=${DB_USERNAME:-saprf}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./.env:/var/www/html/.env:ro
      - saprf-storage:/var/www/html/storage/app
      - saprf-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_healthy
    networks:
      - saprf-internal
    # Overrides the app image's `curl /up` healthcheck (there's no HTTP server
    # in this container). Probes for a live queue:work process instead, which
    # is what "healthy" actually means for a worker.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    image: saprf-app:latest
    container_name: saprf-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=saprf-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saprf_platform}
      - DB_USERNAME=${DB_USERNAME:-saprf}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - saprf-storage:/var/www/html/storage/app
      - saprf-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_healthy
    networks:
      - saprf-internal
    # Overrides the app image's `curl /up` healthcheck (there's no HTTP server
    # in this container). The scheduler loop wraps `php artisan schedule:run`
    # in a shell `while true`; probing for the shell parent proves the loop is
    # alive even between per-minute artisan invocations.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:run' > /dev/null || pgrep -f 'sleep 60' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  saprf-internal:
    driver: bridge

volumes:
  saprf-db:
    driver: local
  saprf-storage:
    driver: local
  saprf-logs:
    driver: local
