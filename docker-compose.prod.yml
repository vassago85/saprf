services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: saprf-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=saprf-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saprf_platform}
      - DB_USERNAME=${DB_USERNAME:-saprf}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
    volumes:
      - ./.env:/var/www/html/.env:ro
      - saprf-storage:/var/www/html/storage/app
      - saprf-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - saprf-internal
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mariadb:10.11
    container_name: saprf-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-ssl
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Root password required}
      MYSQL_DATABASE: ${DB_DATABASE:-saprf_platform}
      MYSQL_USER: ${DB_USERNAME:-saprf}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Database password required}
    volumes:
      - saprf-db:/var/lib/mysql
    networks:
      - saprf-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: saprf-redis
    restart: unless-stopped
    networks:
      - saprf-internal

  queue:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: saprf-queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=saprf-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saprf_platform}
      - DB_USERNAME=${DB_USERNAME:-saprf}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./.env:/var/www/html/.env:ro
      - saprf-storage:/var/www/html/storage/app
      - saprf-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_healthy
    networks:
      - saprf-internal

  scheduler:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: saprf-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=saprf-db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saprf_platform}
      - DB_USERNAME=${DB_USERNAME:-saprf}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - saprf-storage:/var/www/html/storage/app
      - saprf-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_healthy
    networks:
      - saprf-internal

networks:
  saprf-internal:
    driver: bridge
  nginx-proxy-manager_default:
    external: true

volumes:
  saprf-db:
    driver: local
  saprf-storage:
    driver: local
  saprf-logs:
    driver: local
